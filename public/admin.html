<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DXプレイス予約システム（管理者）</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 上の帯（screens.md 4.1）。認証の画面では隠す。画面のボタンは機能ごとの実装で足す -->
  <nav id="bar" hidden>
    <button type="button" data-screen="devices">機器</button>
    <button type="button" id="logout">認証を解く</button>
    <span id="admin-label"></span>
  </nav>

  <!-- 認証（screens.md 4.2。ADM-2） -->
  <section id="screen-login" hidden>
    <h1>管理者の認証</h1>
    <p class="message"></p>
    <form id="login-form">
      <label>ID <input type="text" id="login-id" autocomplete="username"></label>
      <label>パスワード <input type="password" id="login-password" autocomplete="current-password"></label>
      <button type="submit">認証する</button>
    </form>
  </section>

  <!-- 機器（screens.md 4.3。MNG-1）。中身は機器の実装で足す -->
  <section id="screen-devices" hidden>
    <h1>機器</h1>
    <p class="message"></p>
  </section>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
