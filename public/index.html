<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DXプレイス予約システム</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 上の帯（screens.md 3.1）。利用の開始の画面では隠す。画面のボタンは機能ごとの実装で足す -->
  <nav id="bar" hidden>
    <button type="button" data-screen="day">予約状況</button>
    <button type="button" data-screen="mine">自分の予約</button>
    <button type="button" data-screen="change">名前・期生の変更</button>
    <button type="button" data-screen="login">ログイン</button>
    <span id="user-label">操作する人：未ログイン</span>
  </nav>

  <!-- 利用の開始（screens.md 3.2。USR-2）。入力欄もボタンも置かない。値は QR コードの URL からだけ受け取る -->
  <section id="screen-start" hidden>
    <h1>DXプレイス予約システム</h1>
    <p class="message"></p>
  </section>

  <!-- 予約状況（screens.md 3.4。VIW-1）。機器の選択と日まで。「最新にする」と時間帯の一覧は予約状況の実装で足す -->
  <section id="screen-day" hidden>
    <h1>予約状況</h1>
    <p class="message"></p>
    <label>機器 <select id="day-device"></select></label>
    <label>日 <input type="date" id="day-date"></label>
    <p id="day-empty" hidden>機器がありません。</p>
    <!-- 確保・予約なしの利用は予約の操作の実装で動かす。それまでは押せない -->
    <button type="button" id="day-reserve" disabled>予約する</button>
    <button type="button" id="day-walk-in" disabled>予約なしで使い始める</button>
  </section>

  <!-- 自分の予約（screens.md 3.7。RSV-7）。中身は予約の操作の実装で足す。利用者が要る画面 -->
  <section id="screen-mine" hidden>
    <h1>自分の予約</h1>
    <p class="message"></p>
  </section>

  <!-- ログイン（screens.md 3.3.2。USR-3, USR-4）。欄の並びは台帳が確かめる順と同じ。maxlength は付けない（3.3.1） -->
  <section id="screen-login" hidden>
    <h1>ログイン</h1>
    <p class="message"></p>
    <form id="login-form">
      <fieldset>
        <legend>生徒か教員か</legend>
        <label><input type="radio" name="role" value="student"> 生徒</label>
        <label><input type="radio" name="role" value="teacher"> 教員</label>
      </fieldset>
      <label>学籍番号 <input type="text" id="login-student-id" autocomplete="off"></label>
      <button type="submit">ログイン</button>
      <button type="button" id="login-to-register">初めて使う人は登録</button>
    </form>
  </section>

  <!-- 登録（screens.md 3.3.3。USR-3〜USR-7）。欄の並びは台帳が確かめる順と同じ -->
  <section id="screen-register" hidden>
    <h1>登録</h1>
    <p class="message"></p>
    <form id="register-form">
      <fieldset>
        <legend>生徒か教員か</legend>
        <label><input type="radio" name="role" value="student"> 生徒</label>
        <label><input type="radio" name="role" value="teacher"> 教員</label>
      </fieldset>
      <label>学籍番号 <input type="text" id="register-student-id" autocomplete="off"></label>
      <label>名前 <input type="text" id="register-name" autocomplete="off"></label>
      <label id="register-cohort-label">期生 <input type="number" id="register-cohort" min="1" step="1"></label>
      <button type="submit">登録</button>
      <button type="button" id="register-to-login">ログインに戻る</button>
    </form>
  </section>

  <!-- 名前・期生の変更（screens.md 3.3.4。USR-5〜USR-7）。利用者が要る画面。生徒か教員か・学籍番号の欄は置かない -->
  <section id="screen-change" hidden>
    <h1>名前・期生の変更</h1>
    <p class="message"></p>
    <form id="change-form">
      <label>名前 <input type="text" id="change-name" autocomplete="off"></label>
      <label id="change-cohort-label">期生 <input type="number" id="change-cohort" min="1" step="1"></label>
      <button type="submit">変更する</button>
    </form>
  </section>

  <script type="module" src="js/user.js"></script>
</body>
</html>
