# データベースのバックアップ（要件定義 8章「運用と保守」）
# 無料プランには自動バックアップがないので、週1回 pg_dump を取り、暗号化して成果物に90日保存する。
# 公開リポジトリでは成果物を誰でもダウンロードできるため、必ず暗号化する（中身には氏名などが含まれる）。
#
# 必要な Secrets:
#   SUPABASE_DB_URL   … Supabase の接続文字列（Session pooler のもの）
#   BACKUP_PASSPHRASE … 暗号化のパスフレーズ。なくすと復元できないので、引き継ぎ文書とは別に安全に保管する
# 復元の手順は docs/operations.md にある。
name: backup

on:
  schedule:
    - cron: "43 18 * * 6" # 毎週日曜 3:43（日本時間）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: バックアップを取って暗号化する
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Secrets に SUPABASE_DB_URL と BACKUP_PASSPHRASE が必要です"
            exit 1
          fi
          name="dxplace-$(date -u +%Y%m%d-%H%M%S).dump"
          # サーバーと同じメジャーバージョン（17）の pg_dump を使う。カスタム形式で全体を取る
          docker run --rm -e DB_URL="$SUPABASE_DB_URL" postgres:17 \
            sh -c 'pg_dump "$DB_URL" --format=custom --no-owner --no-privileges' > "$name"
          test -s "$name"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "$name.gpg" "$name"
          # 暗号化していないファイルは残さない
          shred -u "$name"
          mkdir out && mv "$name.gpg" out/
          ls -l out

      - name: 成果物として保存する（90日）
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: out/*.gpg
          retention-days: 90
          if-no-files-found: error
